[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyanyapi"
dynamic = ["version"]
description = "Tools for convenient interface creation over various types of data in a declarative way."
keywords = ["parsing", "interface", "xml", "json", "csv", "yaml", "API", "XPath", "regexp"]
authors = [{ name = "Dmitry Dygalo", email = "dmitry@dygalo.dev" }]
maintainers = [{ name = "Dmitry Dygalo", email = "dmitry@dygalo.dev" }]
readme = "README.rst"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Text Processing :: General",
  "Topic :: Utilities",
]
dependencies = ["lxml>=4.9.1", "PyYAML>=6.0"]

[project.optional-dependencies]
tests = ["coverage[toml]>=7.2", "pytest>=8"]

[project.urls]
Changelog = "https://github.com/Stranger6667/pyanyapi/blob/master/docs/changelog.rst"
"Bug Tracker" = "https://github.com/Stranger6667/pyanyapi/issues"
Funding = "https://github.com/sponsors/Stranger6667"
"Source Code" = "https://github.com/Stranger6667/pyanyapi"

[tool.hatch.version]
path = "src/pyanyapi/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/test"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
testpaths = ["test"]

[tool.coverage.run]
parallel = true
branch = true
source_pkgs = ["pyanyapi"]

[tool.coverage.paths]
source = ["src", ".tox/*/site-packages", ".tox/*/lib/*/site-packages", ".tox/*/Lib/site-packages"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 100
exclude_also = ["raise NotImplementedError"]
